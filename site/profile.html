  <main id="main">
    <section class="timeline auth" aria-labelledby="profile-title">
      <div class="container">
        <h1 id="profile-title" class="timeline__heading a-reveal" style="--d:.1s">My Profile</h1>
        <div class="timeline__rule a-expand" aria-hidden="true" style="--d:.2s"></div>

        <div class="me a-fade" id="me" hidden>
          <div id="me-card"></div>
          <p class="me__email">Email: <a class="auth__link" id="me-gmail" href=""></a></p>
          <p class="auth__msg is-ok" id="me-msg" role="status" aria-live="polite"></p>
          <button class="btn auth__btn me__edit" type="button" id="me-open">Edit Profile</button>
        </div>

        <form class="auth__card auth__card--wide a-fade" id="me-edit" novalidate hidden>
          <h2 class="wiz__title">Your details</h2>
          <div class="form__row">
            <label class="auth__field">
              <span class="auth__label">First Name</span>
              <input class="auth__input" type="text" name="first_name" autocomplete="given-name" required>
            </label>
            <label class="auth__field">
              <span class="auth__label">Last Name</span>
              <input class="auth__input" type="text" name="last_name" autocomplete="family-name" required>
            </label>
          </div>
          <div class="form__row">
            <label class="auth__field">
              <span class="auth__label">Class Year</span>
              <input class="auth__input" type="text" name="class_year" placeholder="Class of 2028" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" required>
            </label>
            <label class="auth__field">
              <span class="auth__label">Personal Email</span>
              <input class="auth__input" type="email" name="gmail" autocomplete="email" placeholder="you@example.com" required>
            </label>
          </div>
          <label class="auth__field">
            <span class="auth__label">LinkedIn URL</span>
            <input class="auth__input" type="url" name="linkedin_url" autocomplete="url" placeholder="linkedin.com/in/your-name" required>
          </label>
          <h2 class="wiz__title wiz__title--gap">Experience</h2>
          <div class="roles" id="roles"></div>
          <button class="auth__link roles__add" type="button" id="add-role">+ Add a role</button>

          <p class="auth__msg" role="alert" aria-live="polite"></p>
          <button class="btn auth__btn" type="submit">Save Changes</button>
          <p class="me__cancel"><button class="auth__link" type="button" id="me-cancel">Cancel</button></p>
        </form>
      </div>
    </section>
  </main>

  <template id="role-template">
    <div class="role">
      <div class="role__top">
        <button class="role__toggle" type="button" aria-expanded="true">
          <span class="role__title">Role</span>
          <span class="role__sum"></span>
        </button>
        <button class="auth__link role__edit" type="button">Done</button>
        <button class="auth__link role__remove" type="button">Remove</button>
      </div>
      <div class="role__body">
      <div class="form__row">
        <label class="auth__field">
          <span class="auth__label">Industry</span>
          <input class="auth__input" type="text" name="industry" placeholder="Start typing or choose" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false">
        </label>
        <label class="auth__field">
          <span class="auth__label">Position</span>
          <input class="auth__input" type="text" name="position" placeholder="Start typing or choose" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false">
        </label>
      </div>
      <div class="form__row">
        <label class="auth__field">
          <span class="auth__label">Firm</span>
          <input class="auth__input" type="text" name="firm" placeholder="RBC Capital Markets">
        </label>
        <label class="auth__field">
          <span class="auth__label">Location</span>
          <input class="auth__input" type="text" name="location" placeholder="New York, NY" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false">
        </label>
      </div>
      <div class="form__row">
        <label class="auth__field">
          <span class="auth__label">Start</span>
          <input class="auth__input" type="month" name="start_month">
        </label>
        <label class="auth__field">
          <span class="auth__label">End</span>
          <input class="auth__input" type="month" name="end_month">
        </label>
      </div>
      <label class="role__present"><input type="checkbox" name="present"> I currently work here</label>
      </div>
    </div>
  </template>
