  <main id="main">
    <section class="timeline auth" aria-labelledby="signup-title">
      <div class="container">
        <h1 id="signup-title" class="timeline__heading a-reveal" style="--d:.1s">Create an Account</h1>
        <div class="timeline__rule a-expand" aria-hidden="true" style="--d:.2s"></div>

        <form class="auth__card a-fade" id="signup" style="--d:.25s" novalidate>
          <p class="auth__sub auth__sub--top">Sign up with your personal email. An access code is required.</p>
          <label class="auth__field">
            <span class="auth__label">Personal Email Address</span>
            <input class="auth__input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
          </label>
          <label class="auth__field">
            <span class="auth__label">Password</span>
            <input class="auth__input" type="password" name="password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="auth__field">
            <span class="auth__label">Access Code</span>
            <input class="auth__input" type="text" name="code" autocomplete="off" spellcheck="false" required>
          </label>
          <p class="auth__msg" role="alert" aria-live="polite"></p>
          <button class="btn auth__btn" type="submit">Create Account</button>
        </form>

        <p class="auth__switch a-fade" style="--d:.4s">Already a member? <a class="auth__link" href="/login">Sign in</a></p>
      </div>
    </section>
  </main>
